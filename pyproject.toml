[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iotlabwebsocket"
dynamic = ["version"]
description = "Provides server exposing IoT-LAB nodes via a websocket connection."
readme = "README.md"
license = { text = "BSD" }
authors = [
    { name = "IoT-LAB Team", email = "admin@iot-lab.info" },
]
keywords = ["iot", "websocket", "serial", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Communications",
    "License :: OSI Approved :: BSD License",
]
requires-python = ">=3.10"
dependencies = [
    "tornado>=6.1",
]

[project.urls]
Homepage = "http://www.iot-lab.info"

[project.scripts]
iotlab-websocket-service = "iotlabwebsocket.service_cli:main"

[tool.hatch.version]
path = "iotlabwebsocket/__init__.py"

[tool.pytest.ini_options]
addopts = "-v -s --doctest-modules --cov=iotlabwebsocket --cov-report=xml --cov-report=term --cov-report=term-missing --junitxml results.xml"
testpaths = ["iotlabwebsocket"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B"]
ignore = ["E203", "E501", "E231"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "too-many-arguments",
    "too-many-positional-arguments",
    "use-dict-literal",
    "locally-disabled",
    "star-args",
    "bad-option-value",
    "super-with-arguments",
    "logging-fstring-interpolation",
]
